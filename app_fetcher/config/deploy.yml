# Deployment for app_fetcher. Conventions and rationale:
# agent/styleguides/deployment.md and agent/adr/deployment-via-kamal.md.
#
# Before the first `bin/kamal setup`, replace <server-ip>, <domain> and
# <dockerhub-user>, and export the secrets referenced in .kamal/secrets.
# Deploy this app before app_core: it owns the shared Redis accessory.

service: steam-fetcher

image: <dockerhub-user>/steam-fetcher

servers:
  web:
    - <server-ip>
  job:
    hosts:
      - <server-ip>
    # Exactly one Sidekiq process: sidekiq-cron must not run twice.
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Shared kamal-proxy on the VPS. `app_port` matches the image's EXPOSE.
proxy:
  ssl: true
  host: api.<domain>
  app_port: 3000

registry:
  username: <dockerhub-user>
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    APP_CORE_ORIGIN: https://app.<domain>
    DB_HOST: steam-fetcher-db
    DB_USER: postgres
    REDIS_URL: redis://steam-fetcher-redis:6379/0
    REDIS_URL_STREAM: redis://steam-fetcher-redis:6379/2
  secret:
    - RAILS_MASTER_KEY
    - APP_BRIDGE_JWT_SECRET
    - APP_ADMIN_BRIDGE_JWT_SECRET
    - APP_DEMO_JWT_SECRET
    - DB_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

builder:
  arch: amd64

# A cold first boot runs db:prepare; give it more than the default 30s.
deploy_timeout: 60

accessories:
  db:
    image: postgres:15
    host: <server-ip>
    env:
      clear:
        POSTGRES_DB: app_fetcher_production
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    host: <server-ip>
    directories:
      - data:/data
