version: 2
updates:
  - package-ecosystem: bundler
    directory: "/app_fetcher"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: bundler
    directory: "/app_core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/app_core"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
