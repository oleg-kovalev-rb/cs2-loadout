# Deployment for app_core. Conventions and rationale:
# agent/styleguides/deployment.md and agent/adr/deployment-via-kamal.md.
#
# Before the first `bin/kamal setup`, replace 134.209.196.226, cs2-loadout.pro and
# olegkovalevswe, and export the secrets referenced in .kamal/secrets.

service: steam-core

image: olegkovalevswe/steam-core

servers:
  web:
    - 134.209.196.226

# Shared kamal-proxy on the VPS. `app_port` matches the image's EXPOSE.
proxy:
  ssl: true
  host: app.cs2-loadout.pro
  app_port: 3000

registry:
  username: olegkovalevswe
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    APP_FETCHER_PUBLIC_URL: https://api.cs2-loadout.pro
    DB_HOST: steam-core-db
    DB_USER: postgres
    REDIS_URL_DEMO: redis://steam-fetcher-redis:6379/3
  secret:
    - RAILS_MASTER_KEY
    - APP_BRIDGE_JWT_SECRET
    - APP_ADMIN_BRIDGE_JWT_SECRET
    - APP_DEMO_JWT_SECRET
    - DB_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "steam_core_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

# A cold first boot runs db:prepare; give it more than the default 30s.
deploy_timeout: 120

accessories:
  db:
    image: postgres:15
    host: 134.209.196.226
    env:
      clear:
        POSTGRES_DB: app_core_production
        POSTGRES_USER: postgres
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
